language: 'typescript'
layer: 'application'
stack: 'frontend'

fileGroups:
  sources:
    - 'src/**/*'
    - 'package.json'
    - 'tsconfig.json'
    - 'vite.config.ts'
  tests:
    - 'src/**/*.test.*'
    - 'src/**/*.spec.*'

tasks:
  dev:
    command: 'pnpm dev'
    preset: 'server'
  build:
    command: 'pnpm build'
    inputs:
      - '@globs(sources)'
    outputs:
      - 'dist'
  typecheck:
    command: 'pnpm typecheck'
    inputs:
      - '@globs(sources)'
      - 'tsconfig.json'
  lint:
    command: 'pnpm lint'
    inputs:
      - '@globs(sources)'
      - '/frontend/oxlint.config.ts'
